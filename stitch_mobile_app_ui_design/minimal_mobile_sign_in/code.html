<!DOCTYPE html>

<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-surface": "#e0e3e8", "surface-overlay": "#161D24", "on-secondary-fixed": "#00201d", "primary": "#4fdbc8", "inverse-on-surface": "#2d3135", "on-tertiary-container": "#00423a", "on-primary-fixed-variant": "#005048", "surface-container-highest": "#31353a", "tertiary-fixed-dim": "#3cddc7", "surface-dim": "#101418", "status-warning": "#F59E0B", "surface-container-high": "#262a2f", "on-primary": "#003731", "secondary-fixed": "#9cf2e8", "on-tertiary-fixed-variant": "#005047", "surface-variant": "#31353a", "on-error-container": "#ffdad6", "surface-container-low": "#181c20", "badge-controlled": "#BE123C", "status-critical-bg": "#2A0A12", "surface-bright": "#363a3e", "badge-controlled-text": "#FFE4E6", "tertiary-fixed": "#62fae3", "inverse-surface": "#e0e3e8", "secondary-fixed-dim": "#80d5cb", "error": "#ffb4ab", "status-success-bg": "#062312", "primary-fixed-dim": "#4fdbc8", "status-warning-bg": "#2B1A04", "tertiary-container": "#00b8a5", "on-primary-container": "#00423b", "outline": "#859490", "text-muted": "#64748B", "background": "#101418", "surface": "#101418", "surface-container": "#1c2024", "status-critical": "#E11D48", "status-success": "#16A34A", "on-tertiary-fixed": "#00201c", "primary-container": "#14b8a6", "text-primary": "#F1F5F9", "on-secondary": "#003733", "on-error": "#690005", "surface-tint": "#4fdbc8", "border-subtle": "#1E2730", "on-tertiary": "#003731", "surface-raised": "#0E1318", "on-surface-variant": "#bbcac6", "outline-variant": "#3c4947", "secondary": "#80d5cb", "surface-container-lowest": "#0b0f13", "text-secondary": "#94A3B8", "on-background": "#e0e3e8", "surface-base": "#06090C", "inverse-primary": "#006b5f", "on-primary-fixed": "#00201c", "on-secondary-fixed-variant": "#00504a", "border-strong": "#2C3946", "on-secondary-container": "#9af0e5", "primary-fixed": "#71f8e4", "error-container": "#93000a", "tertiary": "#3cddc7", "secondary-container": "#007068" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin-mobile": "0.75rem", "row-standard": "3rem", "gap-md": "0.75rem", "gap-xs": "0.25rem", "gap-xl": "1.5rem", "gutter-mobile": "0.75rem", "row-dense": "2.25rem", "gap-sm": "0.5rem", "gap-2xs": "0.125rem", "gap-lg": "1rem", "gap-2xl": "2rem" }, fontFamily: { "body-md": ["Geist"], "headline-sm": ["Space Grotesk"], "data-tabular-lg": ["Space Grotesk"], "label-md": ["Geist"], "label-sm": ["Geist"], "body-sm": ["Geist"], "data-tabular-md": ["Geist"], "label-lg": ["Space Grotesk"], "body-lg": ["Geist"], "headline-lg": ["Space Grotesk"], "headline-md": ["Space Grotesk"], "headline-lg-mobile": ["Space Grotesk"] }, fontSize: { "body-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "400" }], "headline-sm": ["15px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "600" }], "data-tabular-lg": ["20px", { "lineHeight": "24px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "label-md": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "500" }], "label-sm": ["9px", { "lineHeight": "12px", "letterSpacing": "0.06em", "fontWeight": "600" }], "body-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "400" }], "data-tabular-md": ["13px", { "lineHeight": "16px", "letterSpacing": "-0.01em", "fontWeight": "500" }], "label-lg": ["13px", { "lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "600" }], "body-lg": ["15px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg-mobile": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "700" }] } } } }</script></head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col justify-between antialiased selection:bg-primary selection:text-on-primary"><main class="flex-1 flex flex-col justify-between w-full max-w-md mx-auto px-6 pt-safe pb-safe min-h-screen">
<!-- TOP BRAND HEADER -->
<div class="flex flex-col items-center text-center pt-8 pb-4">
<div class="w-16 h-16 rounded-2xl bg-surface-raised border border-border-subtle p-3 flex items-center justify-center shadow-lg shadow-black/40 mb-4">
<img alt="St. Jude Clinical Pharmacy emblem" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1VlUk740jGaYsGL53n-YkOfHIy5a4y0R2FFpGf44Zpav2srg4wLQV1UoMrTUaiMtq8VCQfClmwkMceK_7IZHn0Mu9fgX7XjOEbijCdHdtGoXvAUnXWgEZBJuTSbE7au64SXdX1LRTeDRpqAayV25RFqjO4IIy1bWctuePjvm0pJVJZ6Wqjnygq8tZG6_qwXkVcv1pm38V16tCtpmYE-A0jM9LikWInB90BXAea4I4qfkK-_pO--JGIn"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-text-primary tracking-tight uppercase">St. Jude Pharmacy</h1>
<p class="font-body-md text-text-secondary mt-1">Clinical Dispense &amp; Terminal Auth</p>
</div>
<!-- AUTH FORM CONTAINER -->
<div class="flex flex-col w-full gap-5">
<!-- REFINED ROLE PILL SELECTOR -->
<div class="grid grid-cols-2 p-1 bg-surface-container-low rounded-xl border border-border-subtle">
<button class="py-2 px-3 text-center rounded-lg transition-all bg-primary-container text-on-primary-container font-label-lg text-label-lg font-semibold flex items-center justify-center gap-1.5 shadow-sm" id="role-dispenser" onclick="switchRole('dispenser')" type="button">
<span class="material-symbols-outlined text-[18px]">vaccines</span>
<span>Worker</span>
</button>
<button class="py-2 px-3 text-center rounded-lg transition-all text-text-secondary hover:text-text-primary font-label-lg text-label-lg font-semibold flex items-center justify-center gap-1.5" id="role-admin" onclick="switchRole('admin')" type="button">
<span class="material-symbols-outlined text-[18px]">admin_panel_settings</span>
<span>Admin</span>
</button>
</div>
<!-- CREDENTIAL FIELDS -->
<div class="flex flex-col gap-3.5">
<!-- STAFF ID / EMAIL -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm uppercase tracking-wider text-text-muted px-1" for="staff-id">Staff License or Email</label>
<div class="flex items-center bg-surface-raised border border-border-subtle focus-within:border-primary rounded-xl h-12 px-3.5 transition-colors">
<span class="material-symbols-outlined text-text-muted text-[20px] mr-2.5">badge</span>
<input class="bg-transparent w-full text-text-primary placeholder:text-text-muted/60 font-body-md outline-none" id="staff-id" placeholder="e.g. RPH-44901 or name@stjude.org" type="text" value="RPH-44901"/>
<span class="material-symbols-outlined text-status-success text-[18px]">check_circle</span>
</div>
</div>
<!-- SECURITY PIN / PASSWORD -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center px-1">
<label class="font-label-sm text-label-sm uppercase tracking-wider text-text-muted" for="pin-input">Security PIN / Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="flex items-center justify-between bg-surface-raised border border-border-subtle focus-within:border-primary rounded-xl h-12 px-3.5 transition-colors">
<span class="material-symbols-outlined text-text-muted text-[20px] mr-2.5">lock</span>
<input class="bg-transparent w-full text-text-primary placeholder:text-text-muted/60 font-body-md outline-none tracking-widest text-lg" id="pin-input" placeholder="••••" type="password" value="8492"/>
<button aria-label="Toggle pin visibility" class="text-text-muted hover:text-text-primary transition-colors p-1" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>
</div>
<!-- ACTIONS: CTA & BIOMETRIC -->
<div class="flex items-center gap-3 pt-2">
<button class="flex-1 h-12 bg-primary hover:bg-primary-fixed text-on-primary font-headline-sm text-headline-sm uppercase tracking-wider rounded-xl flex items-center justify-center gap-2 active:scale-[0.99] transition-all shadow-lg shadow-primary/20" id="sign-in-btn" type="button">
<span>Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- SLEEK BIOMETRIC BUTTON -->
<button aria-label="Sign in with Face ID or Biometrics" class="w-12 h-12 shrink-0 rounded-xl bg-surface-raised hover:bg-surface-overlay border border-border-subtle hover:border-primary/40 text-primary flex items-center justify-center transition-all active:scale-95 shadow-sm" title="Biometric Sign-In" type="button">
<span class="material-symbols-outlined text-[24px]">fingerprint</span>
</button>
</div>
</div>
<!-- DISCRETE SECURE FOOTER -->
<div class="flex items-center justify-center gap-1.5 py-6 text-text-muted">
<span class="material-symbols-outlined text-[15px] text-primary/80">lock</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Secured &amp; Encrypted · Node M-04</span>
</div>
</main>
<script>
  function switchRole(role) {
    const dispenserBtn = document.getElementById('role-dispenser');
    const adminBtn = document.getElementById('role-admin');
    const staffInput = document.getElementById('staff-id');
    
    if (role === 'dispenser') {
      dispenserBtn.className = "py-2 px-3 text-center rounded-lg transition-all bg-primary-container text-on-primary-container font-label-lg text-label-lg font-semibold flex items-center justify-center gap-1.5 shadow-sm";
      adminBtn.className = "py-2 px-3 text-center rounded-lg transition-all text-text-secondary hover:text-text-primary font-label-lg text-label-lg font-semibold flex items-center justify-center gap-1.5";
      staffInput.value = "RPH-44901";
    } else {
      adminBtn.className = "py-2 px-3 text-center rounded-lg transition-all bg-primary-container text-on-primary-container font-label-lg text-label-lg font-semibold flex items-center justify-center gap-1.5 shadow-sm";
      dispenserBtn.className = "py-2 px-3 text-center rounded-lg transition-all text-text-secondary hover:text-text-primary font-label-lg text-label-lg font-semibold flex items-center justify-center gap-1.5";
      staffInput.value = "admin.lead@stjude.org";
    }
  }

  const signBtn = document.getElementById('sign-in-btn');
  if (signBtn) {
    signBtn.addEventListener('click', () => {
      signBtn.innerHTML = `
        <span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
        <span>Authenticating...</span>
      `;
      setTimeout(() => {
        signBtn.innerHTML = `
          <span class="material-symbols-outlined text-[18px]">check</span>
          <span>Authorized</span>
        `;
        signBtn.classList.remove('bg-primary');
        signBtn.classList.add('bg-status-success', 'text-white');
      }, 700);
    });
  }
</script></body></html>
